name: daywise
description: DayWise - an offline expense calendar. See what you spent every day, week and month.
publish_to: 'none'
# version: <name>+<build number>. Increase the build number (after +) for EVERY Play Store upload.
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  sqflite: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  local_auth: ^3.0.2
  google_mobile_ads: ^9.2.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5B4BDB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
